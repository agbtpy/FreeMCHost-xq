name: FreeMCHost 续期

on:
  schedule:
    - cron: '12 5 * * *'
  workflow_dispatch:

jobs:
  Renew-bot:
    name: FreeMCHost 自动续期
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils xdotool scrot fonts-noto-cjk \
            jq wget curl
          python -m pip install --upgrade pip
          python -m pip install 'seleniumbase>=4.25.0' 'requests>=2.31.0'
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OUTPUT_DIR: /tmp/freemchost-screenshots
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            python3 scripts/freemchost_renewal.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -rf /tmp/freemchost-screenshots
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ "$count" -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done
